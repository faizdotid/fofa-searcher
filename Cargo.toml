[package]
name = "fofa-searcher"
version = "0.2.0"
edition = "2021"
authors = ["faizdotid"]
description = "FOFA API searcher with concurrent fetching"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
base64 = "0.22"
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
